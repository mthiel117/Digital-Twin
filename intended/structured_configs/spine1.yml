aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: MLAG_spine2_Ethernet3
  shutdown: false
  channel_group:
    id: 1000
    mode: active
  metadata:
    peer: spine2
    peer_interface: Ethernet3
    peer_type: mlag_peer
- name: Ethernet4
  description: MLAG_spine2_Ethernet4
  shutdown: false
  channel_group:
    id: 1000
    mode: active
  metadata:
    peer: spine2
    peer_interface: Ethernet4
    peer_type: mlag_peer
- name: Ethernet1
  description: L2_leaf1_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: leaf1
    peer_interface: Ethernet1
    peer_type: l2leaf
- name: Ethernet2
  description: L2_leaf2_Ethernet1
  shutdown: false
  channel_group:
    id: 2
    mode: active
  metadata:
    peer: leaf2
    peer_interface: Ethernet1
    peer_type: l2leaf
hostname: spine1
ip_igmp_snooping:
  globally_enabled: true
local_users:
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.30.30.11/24
  type: oob
  gateway: 172.30.30.1
metadata:
  is_deployed: true
  platform: cEOSLab
  fabric_name: DIGITAL_TWIN
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: SPINE_PAIR
  local_interface: Vlan4094
  peer_address: 10.255.255.1
  peer_link: Port-Channel1000
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel1000
  description: MLAG_spine2_Port-Channel1000
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel1
  description: L2_leaf1_Port-Channel1
  shutdown: false
  mlag: 1
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 10,20
- name: Port-Channel2
  description: L2_leaf2_Port-Channel1
  shutdown: false
  mlag: 2
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 10,20
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
  no_spanning_tree_vlan: '4094'
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.30.30.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.255.255.0/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 10
  name: USERS
  metadata:
    tenants:
    - LAB
- id: 20
  name: SERVERS
  metadata:
    tenants:
    - LAB
vrfs:
- name: MGMT
  ip_routing: false
