---
type: l2leaf

l2leaf:
  defaults:
    platform: cEOSLab
    # Each leaf is standalone; the two spines form its upstream MLAG pair.
    mlag: false
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
    uplink_switches: [spine1, spine2]
    uplink_interfaces: [Ethernet1, Ethernet2]
  nodes:
    - name: leaf1
      id: 1
      mgmt_ip: 172.30.30.21/24
      # Position matches uplink_switches and uplink_interfaces above.
      uplink_switch_interfaces: [Ethernet1, Ethernet1]
    - name: leaf2
      id: 2
      mgmt_ip: 172.30.30.22/24
      uplink_switch_interfaces: [Ethernet2, Ethernet2]
