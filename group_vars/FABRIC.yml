---
fabric_name: DIGITAL_TWIN

# Both regular and twin builds use cEOS-compatible interface names.
mgmt_interface_settings:
  interface: Management1
  vrf: MGMT
mgmt_gateway: 172.30.30.1

management_eapi:
  enabled: true

eos_designs_documentation:
  topology_csv: true
  p2p_links_csv: true

# Native AVD 6.5 digital twin inputs. The twin playbook enables the mode.
# fabric: {} is required by the 6.5 schema even for Containerlab.
digital_twin:
  environment: containerlab
  fabric: {}
  use_default_interfaces_of_digital_twin_platform: true

# Repository helper variable, NOT an AVD schema field. The twin playbook
# applies this image after generation (also AVD 6.5's default).
_containerlab_image: arista/ceos:latest

# Default lab login and Ansible credentials: admin with no password.
ansible_user: admin
ansible_password: ""

aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      no_password: true
  authentication:
    policies:
      local:
        allow_nopassword: true
  authorization:
    exec:
      default: local

# Shared L2 services. No VXLAN, EVPN, BGP, or tenant routing is needed.
tenants:
  - name: LAB
    l2vlans:
      - id: 10
        name: USERS
      - id: 20
        name: SERVERS
