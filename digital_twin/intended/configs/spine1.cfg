!
no enable password
no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname spine1
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 4096
!
vlan 10
   name USERS
!
vlan 20
   name SERVERS
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel1
   description L2_LEAF_PAIR_1_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 10,20
   switchport mode trunk
   switchport
   mlag 1
!
interface Port-Channel3
   description L2_LEAF_PAIR_2_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 10,20
   switchport mode trunk
   switchport
   mlag 3
!
interface Port-Channel1000
   description MLAG_spine2_Port-Channel1000
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description L2_leaf1_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_leaf2_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet3
   description L2_leaf3_Ethernet1
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description L2_leaf4_Ethernet1
   no shutdown
   channel-group 3 mode active
!
interface Ethernet5
   description MLAG_spine2_Ethernet5
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet6
   description MLAG_spine2_Ethernet6
   no shutdown
   channel-group 1000 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.30.30.11/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9214
   no autostate
   ip address 10.255.255.0/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id SPINE_PAIR
   local-interface Vlan4094
   peer-address 10.255.255.1
   peer-link Port-Channel1000
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf MGMT 0.0.0.0/0 172.30.30.1
!
end
