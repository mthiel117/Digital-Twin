aaa_authentication:
  policies:
    local:
      allow_nopassword: true
aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: L2_spine1_Ethernet2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: spine1
    peer_interface: Ethernet2
    peer_type: l2spine
- name: Ethernet2
  description: L2_spine2_Ethernet2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: spine2
    peer_interface: Ethernet2
    peer_type: l2spine
hostname: leaf2
ip_igmp_snooping:
  globally_enabled: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.30.30.22/24
  type: oob
  gateway: 172.30.30.1
metadata:
  is_deployed: true
  platform: cEOSLab
  fabric_name: DIGITAL_TWIN
  validate_hardware:
    enabled: false
  digital_twin:
    environment: containerlab
port_channel_interfaces:
- name: Port-Channel1
  description: L2_SPINE_PAIR_Port-Channel2
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 10,20
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 16384
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.30.30.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 10
  name: USERS
  metadata:
    tenants:
    - LAB
- id: 20
  name: SERVERS
  metadata:
    tenants:
    - LAB
vrfs:
- name: MGMT
  ip_routing: false
